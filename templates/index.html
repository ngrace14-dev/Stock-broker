<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <title>Stock Broker v3.7 DEFCON 0 — Web Wrapper Terminal</title>
  <style>
    :root {
      --bg-primary: #0b0f17;
      --bg-panel: #131a27;
      --bg-card: #1a2333;
      --border: #27344d;
      --text-main: #e6edf3;
      --text-muted: #8b9bb4;
      --accent: #3b82f6;
      --green: #10b981;
      --red: #ef4444;
      --amber: #f59e0b;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, monospace;
    }
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      min-height: 100dvh;
      background: var(--bg-primary);
      color: var(--text-main);
      font-family: var(--font);
      overflow-x: hidden;
      line-height: 1.45;
    }
    .app-shell {
      display: flex;
      flex-direction: column;
      min-height: 100dvh;
      max-width: 1600px;
      margin: 0 auto;
      padding: 12px 16px 24px;
      gap: 14px;
    }
    .topbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 16px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .brand h1 {
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: 0.4px;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 999px;
      background: var(--bg-card);
      border: 1px solid var(--border);
    }
    .badge.green { color: var(--green); border-color: rgba(16,185,129,0.4); }
    .badge.amber { color: var(--amber); border-color: rgba(245,158,11,0.4); }
    .badge.red { color: var(--red); border-color: rgba(239,68,68,0.4); }
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 12px;
    }
    .kpi-card {
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
    }
    .kpi-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      color: var(--text-muted);
      letter-spacing: 0.5px;
    }
    .kpi-value {
      font-size: 1.4rem;
      font-weight: 700;
      margin-top: 4px;
      word-break: break-word;
    }
    .kpi-sub {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 4px;
    }
    .main-grid {
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: 14px;
      align-items: start;
    }
    @media (max-width: 1024px) {
      .main-grid {
        grid-template-columns: 1fr;
      }
    }
    .panel {
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-width: 0;
    }
    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      padding-bottom: 8px;
      gap: 8px;
      flex-wrap: wrap;
    }
    .panel-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: #fff;
    }
    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    label {
      font-size: 0.75rem;
      color: var(--text-muted);
    }
    input, select {
      width: 100%;
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 0.88rem;
    }
    .btn-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    button {
      cursor: pointer;
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: var(--text-main);
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 0.82rem;
      font-weight: 600;
      transition: opacity 0.15s;
    }
    button:hover { opacity: 0.9; }
    .btn-buy { background: var(--green); color: #04130d; border-color: var(--green); flex: 1; }
    .btn-sell { background: var(--red); color: #fff; border-color: var(--red); flex: 1; }
    .btn-accent { background: var(--accent); color: #fff; border-color: var(--accent); }
    .btn-warn { background: var(--amber); color: #1a1202; border-color: var(--amber); }
    .table-wrap {
      width: 100%;
      overflow-x: auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.82rem;
    }
    th, td {
      text-align: left;
      padding: 8px 10px;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }
    th {
      color: var(--text-muted);
      font-weight: 600;
      font-size: 0.75rem;
      text-transform: uppercase;
    }
    .log-box {
      max-height: 220px;
      overflow-y: auto;
      background: var(--bg-primary);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px;
      font-family: monospace;
      font-size: 0.78rem;
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand">
        <h1>AUTO-BROKER TERMINAL // v3.7 DEFCON 0</h1>
        <span id="modeBadge" class="badge amber">LOADING...</span>
        <span id="stateBadge" class="badge green">STATE: IDLE</span>
        <span id="signalBadge" class="badge green">SIGNAL: BUY</span>
      </div>
      <div class="btn-row">
        <button class="btn-accent" onclick="triggerStrategyTick()">Run VelocityBeta Strategy Tick</button>
        <button onclick="triggerSettlementSync()">9:29:30 Settlement Sync</button>
        <button onclick="refreshState()">Refresh Telemetry</button>
      </div>
    </header>

    <div id="statusToast" class="toast"></div>

    <section class="kpi-grid">
      <div class="kpi-card">
        <div class="kpi-label">Total Equity</div>
        <div class="kpi-value" id="kpiEquity">$0.00</div>
        <div class="kpi-sub" id="kpiAccountMode">Account: --</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Settled Cash / Buying Power</div>
        <div class="kpi-value" id="kpiCash">$0.00</div>
        <div class="kpi-sub" id="kpiBuyingPower">Buying Power: $0.00</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Router 30% Firewall Cap</div>
        <div class="kpi-value" id="kpiFirewallCap">$0.00</div>
        <div class="kpi-sub">Max Single-Order Notional (30% Equity)</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">v3.7 Ledger Reconciliation</div>
        <div class="kpi-value" id="kpiDiscrepancy">$0.00</div>
        <div class="kpi-sub" id="kpiLedgerStatus">Invariants: Verified</div>
      </div>
    </section>

    <main class="main-grid">
      <div style="display:flex; flex-direction:column; gap:14px;">
        <section class="panel">
          <div class="panel-header">
            <span class="panel-title">Order Execution & Firewall Gate</span>
            <span class="badge" id="keyBadge">Key: --</span>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="orderSymbol">Ticker Symbol</label>
              <input id="orderSymbol" type="text" value="NVDA" />
            </div>
            <div class="form-group">
              <label for="orderNode">Node ID</label>
              <select id="orderNode">
                <option value="1">Node 1 (VELOCITY_BETA)</option>
                <option value="2">Node 2 (HARDWARE_TECH)</option>
                <option value="3">Node 3 (PRECIOUS_METALS)</option>
                <option value="4">Node 4 (DIVIDEND_INSURER)</option>
              </select>
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="orderQty">Quantity (Shares)</label>
              <input id="orderQty" type="number" step="0.01" value="2" />
            </div>
            <div class="form-group">
              <label for="orderType">Order Type</label>
              <select id="orderType">
                <option value="market">Market</option>
                <option value="limit">Limit</option>
              </select>
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="orderPrice">Est. / Limit Price ($)</label>
              <input id="orderPrice" type="number" step="0.01" value="142.10" />
            </div>
            <div class="form-group">
              <label>Est. Notional</label>
              <input id="orderNotionalPreview" type="text" value="$284.20" readonly />
            </div>
          </div>
          <div class="btn-row">
            <button class="btn-buy" onclick="submitOrder('buy')">BUY ORDER</button>
            <button class="btn-sell" onclick="submitOrder('sell')">SELL ORDER</button>
          </div>
          <div class="btn-row" style="margin-top:4px;">
            <button class="btn-warn" style="flex:1;" onclick="flattenSymbol()">2-Phase Async Flatten</button>
            <button class="btn-sell" style="flex:1;" onclick="triggerEscapeValve()">Catastrophic Escape Valve</button>
          </div>
        </section>

        <section class="panel">
          <div class="panel-header">
            <span class="panel-title">Tier-0/1 Backtest Beta Simulator</span>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="btTier">Node Tier</label>
              <select id="btTier">
                <option value="0">Tier 0 (80% Alloc)</option>
                <option value="1">Tier 1 (40% Alloc)</option>
              </select>
            </div>
            <div class="form-group">
              <label for="btCapital">Active Capital ($)</label>
              <input id="btCapital" type="number" step="1" value="50" />
            </div>
          </div>
          <button class="btn-accent" onclick="runBacktest()">Run Friction & Graduation Check</button>
          <div id="btOutput" style="font-size:0.8rem; color:var(--text-muted);">Click above to test Tier graduation & friction model.</div>
        </section>
      </div>

      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .toast {
      padding: 10px 12px;
      border-radius: 6px;
      font-size: 0.82rem;
      background: var(--bg-card);
      border-left: 4px solid var(--accent);
      display: none;
      word-break: break-word;
      <div style="display:flex; flex-direction:column; gap:14px; min-width:0;">
        <section class="panel">
          <div class="panel-header">
            <span class="panel-title">Open Positions</span>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Symbol</th>
                  <th>Qty</th>
                  <th>Avg Entry</th>
                  <th>Current</th>
                  <th>Market Value</th>
                  <th>Unrealized P&L</th>
                  <th>Action</th>
                </tr>
              </thead>
              <tbody id="positionsBody"></tbody>
            </table>
          </div>
        </section>

        <section class="panel">
          <div class="panel-header">
            <span class="panel-title">Self-Replicating Division Nodes (v3.7 Schema)</span>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Node</th>
                  <th>Division</th>
                  <th>Cadence</th>
                  <th>Ticker</th>
                  <th>Tier</th>
                  <th>Active Capital</th>
                  <th>Cold Storage (1:1)</th>
                  <th>Status</th>
                </tr>
              </thead>
              <tbody id="nodesBody"></tbody>
            </table>
          </div>
        </section>

        <section class="panel">
          <div class="panel-header">
            <span class="panel-title">Recent Orders & Execution Audit Stream</span>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Order ID</th>
                  <th>Symbol</th>
                  <th>Side</th>
                  <th>Qty</th>
                  <th>Type</th>
                  <th>Status</th>
                  <th>Fill Price</th>
                </tr>
              </thead>
              <tbody id="ordersBody"></tbody>
            </table>
          </div>
          <div class="log-box" id="activityLog"></div>
        </section>
      </div>
    </main>
  </div>

    }
  </style>
</head>
  <script>
    function showToast(msg, isError = false) {
      const el = document.getElementById('statusToast');
      el.style.display = 'block';
      el.style.borderLeftColor = isError ? 'var(--red)' : 'var(--green)';
      el.textContent = msg;
    }

    function updateNotionalPreview() {
      const q = parseFloat(document.getElementById('orderQty').value || '0');
      const p = parseFloat(document.getElementById('orderPrice').value || '0');
      document.getElementById('orderNotionalPreview').value = '$' + (q * p).toFixed(2);
    }

    document.getElementById('orderQty').addEventListener('input', updateNotionalPreview);
    document.getElementById('orderPrice').addEventListener('input', updateNotionalPreview);

    async function apiPost(url, payload) {
      const res = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload || {})
      });
      return await res.json();
    }

    async function refreshState() {
      try {
        const res = await fetch('/api/state');
        const data = await res.json();

        const acct = data.account || {};
        const sys = data.system || {};
        const led = data.ledger || {};

        const modeBadge = document.getElementById('modeBadge');
        modeBadge.textContent = 'MODE: ' + (acct.mode || 'SANDBOX');
        modeBadge.className = 'badge ' + (acct.connected ? 'green' : 'amber');

        document.getElementById('stateBadge').textContent = 'STATE: ' + (sys.execution_state || 'IDLE');
        document.getElementById('signalBadge').textContent = 'SIGNAL: ' + (sys.current_signal || 'BUY');
        document.getElementById('keyBadge').textContent = 'Alpaca Key: ' + (acct.key_preview || 'NOT_CONFIGURED');

        document.getElementById('kpiEquity').textContent = '$' + (acct.equity || '0.00');
        document.getElementById('kpiAccountMode').textContent = `${acct.account_id || ''} (${acct.status || ''})`;
        document.getElementById('kpiCash').textContent = '$' + (acct.cash || '0.00');
        document.getElementById('kpiBuyingPower').textContent = 'Buying Power: $' + (acct.buying_power || '0.00');
        document.getElementById('kpiFirewallCap').textContent = '$' + (sys.max_single_order_notional || '0.00');
        document.getElementById('kpiDiscrepancy').textContent = '$' + (led.cash_discrepancy || '0.00');
        document.getElementById('kpiLedgerStatus').textContent = led.invariants_verified
          ? 'Invariants: Verified (0.00 delta)'
          : 'ALERT: Discrepancy Detected';

        const posBody = document.getElementById('positionsBody');
        posBody.innerHTML = '';
        (data.positions || []).forEach(p => {
          const pl = parseFloat(p.unrealized_pl || '0');
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td><strong>${p.symbol}</strong></td>
            <td>${p.qty}</td>
            <td>$${p.avg_entry_price}</td>
            <td>$${p.current_price}</td>
            <td>$${p.market_value}</td>
            <td style="color:${pl >= 0 ? 'var(--green)' : 'var(--red)'}">$${p.unrealized_pl}</td>
            <td><button onclick="quickFlatten('${p.symbol}')">Flatten</button></td>
          `;
          posBody.appendChild(tr);
        });
        if (!(data.positions || []).length) {
          posBody.innerHTML = '<tr><td colspan="7" style="color:var(--text-muted)">No open positions</td></tr>';
        }

        const nodesBody = document.getElementById('nodesBody');
        nodesBody.innerHTML = '';
        (data.nodes || []).forEach(n => {
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td>#${n.node_id}</td>
            <td>${n.division}</td>
            <td>${n.cadence}</td>
            <td><strong>${n.ticker}</strong></td>
            <td>Tier ${n.tier}</td>
            <td>$${n.active_capital}</td>
            <td>$${n.cold_storage}</td>
            <td><span class="badge green">${n.status}</span></td>
          `;
          nodesBody.appendChild(tr);
        });

        const ordBody = document.getElementById('ordersBody');
        ordBody.innerHTML = '';
        (data.orders || []).slice(0, 10).forEach(o => {
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td>${o.client_order_id || o.id}</td>
            <td><strong>${o.symbol}</strong></td>
            <td style="color:${o.side === 'buy' ? 'var(--green)' : 'var(--red)'}">${(o.side || '').toUpperCase()}</td>
            <td>${o.qty}</td>
            <td>${o.type}</td>
            <td>${o.status}</td>
            <td>$${o.filled_avg_price}</td>
          `;
          ordBody.appendChild(tr);
        });
        if (!(data.orders || []).length) {
          ordBody.innerHTML = '<tr><td colspan="7" style="color:var(--text-muted)">No orders submitted in this session yet</td></tr>';
        }

        const logBox = document.getElementById('activityLog');
        logBox.innerHTML = '';
        (data.activity_log || []).forEach(e => {
          const div = document.createElement('div');
          div.textContent = `[${e.timestamp}] [${e.category}] (${e.level}) ${e.message}`;
          logBox.appendChild(div);
        });
      } catch (err) {
        showToast('Failed to fetch state: ' + err, true);
      }
    }
    async function submitOrder(side) {
      const payload = {
        symbol: document.getElementById('orderSymbol').value,
        node_id: parseInt(document.getElementById('orderNode').value, 10),
        qty: parseFloat(document.getElementById('orderQty').value),
        order_type: document.getElementById('orderType').value,
        estimated_price: parseFloat(document.getElementById('orderPrice').value),
        limit_price: document.getElementById('orderType').value === 'limit'
          ? parseFloat(document.getElementById('orderPrice').value)
          : null,
        side: side
      };
      const res = await apiPost('/api/order', payload);
      showToast(res.message || JSON.stringify(res), !res.ok);
      await refreshState();
    }

    async function quickFlatten(symbol) {
      const res = await apiPost('/api/flatten', { symbol, reason: 'UI_QUICK_FLATTEN' });
      showToast(`Two-phase flatten completed for ${symbol}`, !res.ok);
      await refreshState();
    }

    async function flattenSymbol() {
      const symbol = document.getElementById('orderSymbol').value;
      await quickFlatten(symbol);
    }

    async function triggerEscapeValve() {
      const symbol = document.getElementById('orderSymbol').value;
      const res = await apiPost('/api/escape-valve', { symbol, price_breach: 5.0 });
      showToast(`Catastrophic Escape Valve executed for ${symbol}`, !res.ok);
      await refreshState();
    }

    async function triggerStrategyTick() {
      const symbol = document.getElementById('orderSymbol').value;
      const qty = parseFloat(document.getElementById('orderQty').value || '2');
      const price = parseFloat(document.getElementById('orderPrice').value || '142.10');
      const node_id = parseInt(document.getElementById('orderNode').value, 10);
      const res = await apiPost('/api/strategy-tick', { symbol, qty, estimated_price: price, node_id });
      showToast(res.message || 'Strategy cycle executed', !res.ok);
      await refreshState();
    }

    async function triggerSettlementSync() {
      const res = await apiPost('/api/settlement-sync', {});
      showToast(res.message || 'Settlement sync triggered');
      await refreshState();
    }

    async function runBacktest() {
      const tier = parseInt(document.getElementById('btTier').value, 10);
      const active_capital = parseFloat(document.getElementById('btCapital').value || '50');
      const entry_price = parseFloat(document.getElementById('orderPrice').value || '100');
      const res = await apiPost('/api/backtest', { tier, active_capital, entry_price });
      if (res.ok) {
        document.getElementById('btOutput').innerHTML =
          `Pos Size: <strong>$${res.recommended_position_size}</strong> | Cold Storage: <strong>$${res.cold_storage}</strong> | ` +
          `Buy w/ Friction: <strong>$${res.modeled_buy_fill}</strong> | Tier-0 Graduation Ready: <strong>${res.tier_0_graduated ? 'YES' : 'NO'}</strong>`;
      }
    }

    refreshState();
  </script>
</body>
</html>
